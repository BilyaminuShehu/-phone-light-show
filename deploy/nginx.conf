# Reverse proxy in front of the single Node instance.
# Handles TLS termination + WebSocket upgrade + serves static files
# directly (faster than round-tripping them through Node).
#
# This is NOT a load balancer across multiple app instances — it's a
# single upstream. At volleyball-arena scale (a few thousand concurrent
# sockets), one Node process behind this is the right amount of
# infrastructure. See ../README.md "Scaling decision" section for why.

upstream light_show_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name light-show.example.com;

    ssl_certificate     /etc/letsencrypt/live/light-show.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/light-show.example.com/privkey.pem;

    # WebSocket upgrade + everything else proxies straight through.
    location / {
        proxy_pass http://light_show_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Required for server.js's admin-auth rate limiter to see the
        # REAL visitor IP instead of nginx's own address. Without this,
        # every connection looks like it's coming from 127.0.0.1 (or
        # whatever this proxy's own address is), so a few wrong admin-key
        # attempts from ANY visitor would lock out the real admin too —
        # $proxy_add_x_forwarded_for correctly appends to any existing
        # chain rather than overwriting it, matching how a CDN/load
        # balancer in front of this nginx instance would also expect it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WS connections are long-lived and mostly idle — don't let nginx
        # time them out mid-show.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name light-show.example.com;
    return 301 https://$host$request_uri;
}
