<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Light Show</title>
<style>
  html, body { margin:0; height:100%; background:#0a0a0a; color:#eee;
    font-family: -apple-system, system-ui, sans-serif; overflow:hidden; }
  #flash { position:fixed; inset:0; background:#000; transition: background-color 0.05s linear; }
  #ui { position:relative; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; height:100%; text-align:center; padding:24px; box-sizing:border-box; }
  h2 { margin:0 0 8px; }
  p.sub { opacity:0.65; font-size:14px; max-width:320px; margin:0 0 24px; }
  button { font-size:19px; font-weight:600; padding:16px 36px; border-radius:14px; border:none;
    background:#e11d48; color:white; }
  button:disabled { opacity:0.5; }
  #status { font-size:13px; opacity:0.6; margin-top:18px; max-width:320px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#4ade80; margin-right:6px;
    vertical-align:middle; }
  .dot.off { background:#555; }
  #winnerOverlay { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,0.92);
    display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px; }
  #winnerOverlay h1 { font-size:34px; margin:0 0 12px; }
  #winnerOverlay p { font-size:17px; max-width:320px; }
  #winnerOverlay button { margin-top:24px; background:#333; }
  /* Separate from #winnerOverlay on purpose — a winner win is always
     the priority message; this only ever shows when that one ISN'T
     already up (see the JS below), so the two never compete for the
     same screen. */
  #thankYouOverlay { position:fixed; inset:0; z-index:9; background:rgba(0,0,0,0.92);
    display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px;
    overflow:hidden; }
  #thankYouOverlay h1 { font-size:32px; margin:0 0 12px; position:relative; z-index:1; }
  #thankYouOverlay p { font-size:16px; max-width:320px; opacity:0.9; position:relative; z-index:1; }
  #thankYouOverlay button { margin-top:24px; background:#333; font-size:15px; padding:10px 24px; position:relative; z-index:1; }
  /* "Gravity" confetti — small colored pieces spawned at the top the
     instant the popup appears, falling with an accelerating (ease-in-
     like) curve to approximate real gravity, tumbling as they fall.
     Spawned fresh in JS each time (see spawnConfetti below) rather than
     sitting in the page permanently, and removed once their animation
     finishes so repeated show/stop cycles don't pile up stale nodes. */
  .confetti-piece { position:absolute; top:-24px; width:8px; height:14px; border-radius:2px;
    animation-name:confettiFall; animation-timing-function:cubic-bezier(0.55,0.06,0.68,0.19);
    animation-fill-mode:forwards; pointer-events:none; }
  @keyframes confettiFall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    100% { transform:translateY(115vh) rotate(600deg); opacity:0.4; }
  }
  #winnerContactForm { margin-top:20px; display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; }
  #winnerContactInput { font-size:16px; padding:13px; border-radius:10px; border:1px solid #444;
    background:#1a1a1a; color:#eee; width:100%; box-sizing:border-box; }
  #winnerContactForm button { margin-top:0; background:#e11d48; }
  #winnerContactStatus { font-size:13px; opacity:0.75; margin-top:10px; max-width:300px; }

  /* Show-active visual: a small animated equalizer-style wave, red/
     blue/white, replacing the static "waiting" text so there's visible
     feedback that the show is actually running (not just the flash
     itself, which — especially in real-torch mode — leaves the screen
     with nothing to look at otherwise). */
  #liveLabel { display:none; font-size:15px; font-weight:700; letter-spacing:0.04em;
    position:relative; z-index:2; color:#f8fafc; text-shadow:0 0 8px rgba(0,0,0,0.8); }
  /* Full-screen flowing wave — several smooth, glowing SVG lines in
     red/blue/white, each independently scrolling horizontally (seamless
     loop, no jump), stacked at different vertical offsets/speeds for a
     layered, organic look — replacing the earlier bar-spectrum version
     with something closer to a real audio-waveform visual. Paths are
     generated once in JS (see buildFullWaveLines below) rather than
     hand-drawn, since a smooth sine-like curve needs many points. */
  #fullWave { position:fixed; inset:0; z-index:1; display:none; overflow:hidden; background:#000; }
  #fullWave svg { position:absolute; top:0; left:0; width:200%; height:100%; }
  @keyframes waveScroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  .wave-burst { position:absolute; width:50px; height:50px; border-radius:50%;
    background:radial-gradient(circle, currentColor 0%, transparent 70%);
    animation-name:burstPulse; animation-timing-function:ease-out; animation-iteration-count:infinite;
    pointer-events:none; }
  @keyframes burstPulse {
    0% { transform:scale(0.2); opacity:0; }
    30% { opacity:0.85; }
    100% { transform:scale(2.4); opacity:0; }
  }
</style>
</head>
<body>
  <div id="flash"></div>
  <!-- Deliberately not display:none or visibility:hidden — some Android
       Chrome builds will suspend the underlying camera pipeline if the
       stream has no actively-rendering consumer, which can make
       applyConstraints({torch:true}) resolve successfully while the
       real LED never actually lights. Rendering it off-screen (not
       hidden) at 1x1px keeps the camera genuinely "live". -->
  <video id="torchKeepAlive" autoplay playsinline muted
    style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; top:0; left:0;"></video>
  <div id="fullWave" aria-hidden="true"></div>
  <div id="ui">
    <h2 id="joinHeading">📱 Telefonunuzu Açık Tutun</h2>
    <p class="sub" id="joinSub">Işık şovu sırasında bağlantınızın kesilmemesi için lütfen telefonunuzu kilitlemeyin veya bu sayfadan ayrılmayın.</p>
    <button id="joinBtn" style="display:none">Işık Şovuna Katıl</button>
    <div id="status"><span class="dot off"></span>Bağlanıyor…</div>
    <div id="liveLabel">Şov Başladı!</div>
  </div>

  <div id="winnerOverlay">
    <h1>🎉</h1>
    <p id="winnerText"></p>
    <form id="winnerContactForm">
      <input type="text" id="winnerContactInput" placeholder="Ödülünüzü almak için telefon numarası veya e-posta" autocomplete="off" />
      <button type="submit">Gönder</button>
    </form>
    <p id="winnerContactStatus"></p>
    <button id="winnerCloseBtn">Kapat</button>
  </div>

  <div id="thankYouOverlay">
    <h1>🙏</h1>
    <p>Işık şovuna katıldığınız için teşekkür ederiz!</p>
    <button id="thankYouCloseBtn">Kapat</button>
  </div>

<script>
const statusEl = document.getElementById('status');
const flashEl = document.getElementById('flash');
const torchKeepAliveEl = document.getElementById('torchKeepAlive');
const liveLabelEl = document.getElementById('liveLabel');
const fullWaveEl = document.getElementById('fullWave');

// Generates a smooth, seamlessly-looping wavy SVG path: drawn once over
// `width` units at `waves` full sine cycles (an integer, so the path's
// start and end line up perfectly), then that same shape is duplicated
// once more immediately after itself — the two copies laid end to end
// LOOK identical at the seam, so animating exactly one copy-width to the
// left (via CSS transform, see waveScroll) loops forever with no visible
// jump or reset.
function buildSeamlessWavePath(width, amplitude, waves, baselineY, phase) {
  const steps = 80;
  const single = [];
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * width;
    const y = baselineY + Math.sin((i / steps) * Math.PI * 2 * waves + phase) * amplitude;
    single.push([x, y]);
  }
  const all = [...single, ...single.map(([x, y]) => [x + width, y])];
  return all.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
}

// Three layered wavy lines — red/yellow/white, each its own amplitude,
// frequency, vertical position, glow, and scroll speed (one running in
// reverse) for a rich, organic "moving wave" look. Bigger amplitude and
// closer baselines than the first version so the lines actually cross
// through each other as they scroll, plus a stronger glow for a more
// vivid, "explosive" feel rather than a flat, static-looking line.
function buildFullWaveLines() {
  const svgns = 'http://www.w3.org/2000/svg';
  const layers = [
    { color: '#e11d48', amplitude: 22, waves: 3, baselineY: 42, duration: '5s', opacity: 0.9, strokeWidth: 1.4, reverse: false, glow: 5 },
    { color: '#facc15', amplitude: 26, waves: 2, baselineY: 50, duration: '7s', opacity: 0.85, strokeWidth: 1.4, reverse: true, glow: 6 },
    { color: '#f8fafc', amplitude: 18, waves: 4, baselineY: 58, duration: '9s', opacity: 0.4, strokeWidth: 1, reverse: false, glow: 3 },
  ];
  layers.forEach((layer, idx) => {
    const svg = document.createElementNS(svgns, 'svg');
    svg.setAttribute('viewBox', '0 0 200 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.style.animation = `waveScroll ${layer.duration} linear infinite${layer.reverse ? ' reverse' : ''}`;
    const path = document.createElementNS(svgns, 'path');
    path.setAttribute('d', buildSeamlessWavePath(100, layer.amplitude, layer.waves, layer.baselineY, idx * 1.3));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', layer.color);
    path.setAttribute('stroke-width', layer.strokeWidth);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.style.opacity = layer.opacity;
    path.style.filter = `drop-shadow(0 0 ${layer.glow}px ${layer.color})`;
    svg.appendChild(path);
    fullWaveEl.appendChild(svg);
  });
  buildWaveBursts();
}

// Small glowing "spark" circles that scale up and fade out on a loop at
// randomized positions/timing across the wave area — the extra bit of
// energetic, pulsing motion that makes the whole thing read as more
// alive/"explosive" rather than just three lines scrolling by.
function buildWaveBursts() {
  const colors = ['#e11d48', '#facc15', '#f8fafc'];
  const burstCount = 10;
  for (let i = 0; i < burstCount; i++) {
    const burst = document.createElement('div');
    burst.className = 'wave-burst';
    burst.style.color = colors[i % colors.length];
    burst.style.left = (5 + Math.random() * 90).toFixed(1) + '%';
    burst.style.top = (15 + Math.random() * 60).toFixed(1) + '%';
    burst.style.animationDuration = (1.6 + Math.random() * 1.8).toFixed(2) + 's';
    burst.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    fullWaveEl.appendChild(burst);
  }
}
buildFullWaveLines();
const joinHeadingEl = document.getElementById('joinHeading');
const joinSubEl = document.getElementById('joinSub');
const joinBtn = document.getElementById('joinBtn');
const winnerOverlay = document.getElementById('winnerOverlay');
const winnerText = document.getElementById('winnerText');
const winnerContactForm = document.getElementById('winnerContactForm');
const winnerContactInput = document.getElementById('winnerContactInput');
const winnerContactStatus = document.getElementById('winnerContactStatus');
let currentWinnerId = null; // set when a 'winner' message arrives, sent back with the contact submission

winnerContactForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const contact = winnerContactInput.value.trim();
  if (!contact) return;
  if (!currentWinnerId) {
    winnerContactStatus.textContent = "Bir şeyler ters gitti — kapatıp tekrar açmayı deneyin ya da doğrudan görevlilere bildirin.";
    return;
  }
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'winner-contact', winnerId: currentWinnerId, contact }));
    winnerContactStatus.textContent = 'Gönderiliyor…';
  } else {
    // Not connected right now (e.g. a brief drop) — the reconnect logic
    // elsewhere in this file will restore the WebSocket on its own; the
    // person just needs to hit Submit again once status updates.
    winnerContactStatus.textContent = "Şu anda bağlı değilsiniz — biraz bekleyip tekrar Gönder'e dokunun.";
  }
});

document.getElementById('winnerCloseBtn').addEventListener('click', () => {
  winnerOverlay.style.display = 'none';
});

const thankYouOverlay = document.getElementById('thankYouOverlay');
let thankYouAutoHideTimer = null;
let confettiCleanupTimer = null;

function spawnConfetti() {
  // Clear any leftover pieces from a previous popup first — this can be
  // called again (a second show-stop) before the last batch finished
  // falling, and stale nodes would otherwise accumulate.
  thankYouOverlay.querySelectorAll('.confetti-piece').forEach((el) => el.remove());
  if (confettiCleanupTimer) clearTimeout(confettiCleanupTimer);

  const colors = ['#e11d48', '#facc15', '#f8fafc'];
  const count = 26;
  let maxDuration = 0;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[i % colors.length];
    const duration = 1.6 + Math.random() * 1.4;
    const delay = Math.random() * 0.5;
    piece.style.animationDuration = duration.toFixed(2) + 's';
    piece.style.animationDelay = delay.toFixed(2) + 's';
    maxDuration = Math.max(maxDuration, duration + delay);
    thankYouOverlay.appendChild(piece);
  }
  // Remove them once every piece has finished falling, rather than
  // leaving finished (invisible but still-in-the-DOM) nodes around.
  confettiCleanupTimer = setTimeout(() => {
    thankYouOverlay.querySelectorAll('.confetti-piece').forEach((el) => el.remove());
  }, (maxDuration + 0.3) * 1000);
}

function showThankYouOverlay() {
  // A winner celebration always takes priority — never show this on top
  // of (or instead of) that, so the two never compete for the screen.
  if (winnerOverlay.style.display === 'flex') return;
  thankYouOverlay.style.display = 'flex';
  spawnConfetti();
  if (thankYouAutoHideTimer) clearTimeout(thankYouAutoHideTimer);
  thankYouAutoHideTimer = setTimeout(() => { thankYouOverlay.style.display = 'none'; }, 6000);
}
document.getElementById('thankYouCloseBtn').addEventListener('click', () => {
  thankYouOverlay.style.display = 'none';
  if (thankYouAutoHideTimer) { clearTimeout(thankYouAutoHideTimer); thankYouAutoHideTimer = null; }
});

// --- persistent per-device id (this is the giveaway de-dup key) ---
function getDeviceId() {
  try {
    let id = localStorage.getItem('light-show-device-id');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
      localStorage.setItem('light-show-device-id', id);
    }
    return id;
  } catch {
    // localStorage unavailable (private mode edge cases) — falls back to a
    // per-tab-session id, which means this device could re-enter the
    // giveaway on a fresh tab. Known v1 limitation, not fixed here.
    return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }
}
const deviceId = getDeviceId();

// Historically iOS Safari exposed no web API for the camera torch at all,
// so this used to hard-skip straight to screen-flash on iOS. That's no
// longer accurate: WebKit quietly added torch support to getUserMedia
// starting around iOS 17.5.1 (mid-2024) — confirmed directly by a WebKit
// engineer on the public bug tracker (webkit.org/show_bug.cgi?id=243075),
// even though Apple never announced it. The standard feature-detection
// call (navigator.mediaDevices.getSupportedConstraints().torch) has its
// own separate bug where it can wrongly report false even when torch
// actually works (webkit.org/show_bug.cgi?id=270779) — so rather than
// checking that flag, this just requests the camera and checks the real,
// per-stream track.getCapabilities().torch after the fact, on every
// platform. Very old iOS (pre-17.5.1, over two years old at this point)
// or any browser without torch support simply falls through to the
// screen-flash fallback below, same as it always did.

let torchTrack = null;
let pendingReconnectTimer = null; // tracked so an immediate reconnect (visibilitychange) can cancel a stale scheduled one
let offset = 0;
let synced = false;
let hasJoined = false; // becomes true once actually joined (auto via permission grant, or manual fallback tap)
let showTimer = null; // interval handle for continuous show-start mode
let ws;

// --- auto-join-on-camera-permission flow ---
// Requirement: scan QR -> browser opens -> immediately asks for camera
// access -> granting it IS the join action, no separate button tap needed.
// wsReadyAndSynced and cameraPermissionOutcome are set by two independent
// async operations (the WebSocket connecting+clock-syncing, and the
// getUserMedia permission prompt) that can finish in either order.
// checkState() is the single place that reconciles them.
let wsReadyAndSynced = false;
let cameraPermissionOutcome = null; // null = still waiting, true = granted, false = denied/unavailable

function setLight(on) {
  if (torchTrack) {
    // Real torch is active — only drive the LED. Also flashing the whole
    // screen white on top of that is redundant and, in a dark venue,
    // actively unpleasant (blinding, and defeats the point of the LED
    // being a small controlled light rather than the whole screen).
    torchTrack.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
  } else {
    // No real torch available — screen flash is the only fallback.
    flashEl.style.background = on ? '#ffffff' : '#000000';
  }
}

async function getRearCameraStream() {
  // facingMode: 'ideal' is only a PREFERENCE — some Android browsers will
  // still hand back the front camera (which never has a torch) if that's
  // what was last used or easiest to grab, silently causing the
  // screen-flash fallback to kick in even on a device that has a real
  // torch. 'exact' forces the real back/environment camera or fails
  // outright (OverconstrainedError) rather than silently substituting —
  // so try exact first, and only fall back to 'ideal' if this device
  // genuinely can't satisfy it (e.g. a single-camera device).
  try {
    return await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'environment' } } });
  } catch {
    return await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
  }
}

async function requestCameraPermission() {
  try {
    const stream = await getRearCameraStream();
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    // Permission grant is the join signal regardless of whether this
    // specific device actually has a controllable torch (e.g. a laptop's
    // built-in webcam has no torch, but granting access still counts as
    // "I'm in"). If there IS a torch, keep the track open to drive it;
    // otherwise release the camera immediately, we don't need it.
    if (caps.torch) {
      torchTrack = track;
      hadTorchOnce = true;
      // Keep the camera pipeline genuinely active (see the <video>
      // element's own comment) — some Android devices silently fail to
      // actually drive the LED without this, even though the torch
      // constraint call itself reports success.
      torchKeepAliveEl.srcObject = stream;
      torchKeepAliveEl.play().catch(() => {});
    } else {
      track.stop();
    }
    cameraPermissionOutcome = true;
  } catch {
    cameraPermissionOutcome = false; // denied, no camera, or insecure context — manual fallback below
  }
  checkState();
}

// Mobile browsers commonly KILL an open camera stream when the tab is
// backgrounded or the phone screen locks — very likely at a real event,
// where people's screens dim or they briefly switch apps. torchTrack
// would then silently be dead (readyState 'ended'), and every future cue
// would look like nothing happened even though the code thinks torch is
// still available. This re-acquires it whenever we reconnect or the tab
// becomes visible again — but ONLY for a device that actually had torch
// working at least once; a device that's screen-flash-only from the
// start has nothing to reacquire, and re-requesting the camera for it
// on every reconnect would just be pointless, mildly intrusive noise.
let hadTorchOnce = false;
async function reacquireTorchIfNeeded() {
  if (!hadTorchOnce) return;
  if (torchTrack && torchTrack.readyState === 'live') return;
  try {
    const stream = await getRearCameraStream();
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      torchTrack = track;
      torchKeepAliveEl.srcObject = stream;
      torchKeepAliveEl.play().catch(() => {});
    } else {
      track.stop();
    }
  } catch {
    // Couldn't reacquire (permission revoked in the meantime, camera
    // busy with another app, etc.) — setLight()'s existing torchTrack
    // branch already handles a null torchTrack by using the screen-flash
    // fallback, so nothing else needs to change here.
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    reacquireTorchIfNeeded();
    requestWakeLock();
    setLight(false);
    // If the WebSocket actually died while backgrounded (iOS in
    // particular can fully suspend a tab after enough time, dropping
    // the connection outright), don't wait for whatever's left of the
    // jittered retry timer from the 'close' handler below — try right
    // now instead, so coming back to the tab reconnects as fast as
    // possible rather than however many seconds were left on that timer.
    if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
      if (pendingReconnectTimer) { clearTimeout(pendingReconnectTimer); pendingReconnectTimer = null; }
      connect();
    }
  }
});

// Screen Wake Lock API: actively prevents the phone's screen from
// auto-locking from inactivity while this page is open and visible —
// directly addresses someone joining, then getting distracted, and their
// phone timing out and locking before the show even starts. This does
// NOT and CANNOT prevent someone deliberately pressing the lock button
// or switching to another app — no website can override that on iOS or
// Android, it's a deliberate OS-level protection, not a bug. Supported
// on Chrome/Android since 2020, desktop Safari since 16.4 (2023), and
// — notably later — Safari on iOS only since iOS 18.4 (March 2025); on
// an iPhone running an older iOS this silently does nothing, falling
// back to normal screen-timeout behavior, same as any unsupported
// browser (checked via 'wakeLock' in navigator, not a version sniff).
let wakeLockSentinel = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return; // unsupported — nothing to do
  if (wakeLockSentinel && !wakeLockSentinel.released) return; // already held
  try {
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    wakeLockSentinel.addEventListener('release', () => {
      // Fires when the OS reclaims it (tab backgrounded, screen
      // deliberately locked, etc.) — re-acquired automatically by the
      // visibilitychange handler above once the tab is visible again.
      wakeLockSentinel = null;
    });
  } catch {
    // Request can fail (e.g. low battery mode on some devices disables
    // wake lock entirely) — falls back to normal screen-timeout
    // behavior, same as an unsupported browser.
  }
}

function doJoin() {
  if (hasJoined) return; // guard against double-join from a race between the two async paths
  hasJoined = true;
  joinBtn.style.display = 'none';
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'join', deviceId }));
  requestWakeLock();
  setStatus(torchTrack ? 'Fener açık 🔦 — şov bekleniyor' : 'Ekran flaşı modu hazır — şov bekleniyor', true);
}

function showManualJoinFallback() {
  if (hasJoined) return;
  joinBtn.textContent = 'Işık Şovuna Katıl';
  joinBtn.style.display = '';
  setStatus('Kamera erişimi yok — ekran flaşı moduyla katılmak için butona dokunun', true);
}

function checkState() {
  if (hasJoined) return;
  if (cameraPermissionOutcome === true && wsReadyAndSynced) {
    doJoin();
  } else if (cameraPermissionOutcome === false) {
    showManualJoinFallback();
  } else if (!wsReadyAndSynced) {
    setStatus('Bağlanıyor…', false);
  } else {
    setStatus('Kamera izni bekleniyor — istendiğinde İzin Ver\'e dokunun', true);
  }
}

function setStatus(text, on) {
  statusEl.innerHTML = `<span class="dot ${on ? '' : 'off'}"></span>${text}`;
}

function syncClock() {
  return new Promise((resolve) => {
    const samples = [];
    let count = 0;
    const tryPing = () => {
      const t0 = Date.now();
      const handler = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type !== 'pong') return;
        const rtt = Date.now() - t0;
        samples.push({ rtt, offset: (msg.serverTime + rtt / 2) - Date.now() });
        ws.removeEventListener('message', handler);
        count++;
        if (count < 5) setTimeout(tryPing, 150);
        else {
          samples.sort((a, b) => a.rtt - b.rtt);
          offset = samples[0].offset;
          synced = true;
          resolve();
        }
      };
      ws.addEventListener('message', handler);
      ws.send(JSON.stringify({ type: 'ping', clientSendTime: t0 }));
    };
    tryPing();
  });
}

function setWaveMotion(running) {
  document.querySelectorAll('#fullWave svg').forEach((svg) => {
    svg.style.animationPlayState = running ? 'running' : 'paused';
  });
}

function showActiveVisual() {
  statusEl.style.display = 'none';
  joinHeadingEl.style.display = 'none';
  joinSubEl.style.display = 'none';
  liveLabelEl.style.display = 'block';
  fullWaveEl.style.display = 'block';
  setWaveMotion(true); // in case a previous pause left it frozen — a fresh cue/show always starts in motion
}

function hideActiveVisual() {
  liveLabelEl.style.display = 'none';
  fullWaveEl.style.display = 'none';
  statusEl.style.display = 'block';
  joinHeadingEl.style.display = '';
  joinSubEl.style.display = '';
}

// A genuine pause (see 'show-pause' handler below) is DELIBERATELY
// different from a full stop: the flash turns off (same cleanup as
// stopContinuousShow — cancel every scheduled setTimeout, force the
// light off) but the wave visual stays exactly where it is on screen,
// just frozen mid-motion, rather than disappearing back to the join
// instructions. Coming out of a pause (a fresh 'cue' or 'show-start'
// arriving) naturally calls showActiveVisual() again, which unfreezes it.
function pauseActiveVisual() {
  if (showTimer) { clearInterval(showTimer); showTimer = null; }
  scheduledLightTimeouts.forEach((id) => clearTimeout(id));
  scheduledLightTimeouts = [];
  setLight(false);
  setWaveMotion(false);
}

// Every setTimeout scheduled by runPattern() (used for one-off cues AND,
// now, a full song-length generated light sequence — see the
// 'song-cue' handling below) is tracked here so show-stop can actually
// cancel them. Previously only the continuous-mode setInterval was
// tracked; a long pattern's individual setTimeouts would keep firing
// even after Stop was clicked, since nothing held onto their IDs.
let scheduledLightTimeouts = [];

function runPattern(pattern, startAt) {
  if (!pattern.length) return;
  const firstDelay = Math.max(0, startAt - offset - Date.now());
  const lastStepT = Math.max(...pattern.map((s) => s.t));
  const lastDelay = Math.max(0, (startAt + lastStepT) - offset - Date.now());

  scheduledLightTimeouts.push(setTimeout(showActiveVisual, firstDelay));
  scheduledLightTimeouts.push(setTimeout(hideActiveVisual, lastDelay + 300));

  pattern.forEach((step) => {
    const delay = Math.max(0, (startAt + step.t) - offset - Date.now());
    scheduledLightTimeouts.push(setTimeout(() => setLight(step.on), delay));
  });
}

function startContinuousShow(startAt, mode, intervalMs) {
  stopContinuousShow();
  const localStart = Math.max(0, startAt - offset - Date.now());
  scheduledLightTimeouts.push(setTimeout(() => {
    showActiveVisual();
    if (mode === 'solid') {
      setLight(true);
    } else {
      let on = true;
      setLight(true);
      showTimer = setInterval(() => { on = !on; setLight(on); }, intervalMs);
    }
  }, localStart));
}

function stopContinuousShow() {
  if (showTimer) { clearInterval(showTimer); showTimer = null; }
  scheduledLightTimeouts.forEach((id) => clearTimeout(id));
  scheduledLightTimeouts = [];
  setLight(false);
  hideActiveVisual();
}

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);

  ws.addEventListener('open', async () => {
    if (hasJoined) setStatus('Yeniden bağlandı. Senkronize ediliyor…', false);
    await syncClock();
    if (hasJoined) {
      // Reconnect after a drop — rejoin automatically (same deviceId, so
      // this can't create a second giveaway entry) so the show keeps
      // working without the person doing anything. Also re-verify torch
      // access in case it died while backgrounded (see
      // reacquireTorchIfNeeded's comment above) — fire-and-forget, this
      // shouldn't delay the rejoin itself.
      reacquireTorchIfNeeded();
      ws.send(JSON.stringify({ type: 'join', deviceId }));
      setStatus('Hazır — şovun başlaması bekleniyor', true);
    } else {
      wsReadyAndSynced = true;
      checkState();
    }
  });

  ws.addEventListener('message', (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'cue' && synced) runPattern(msg.pattern, msg.startAt);
    if (msg.type === 'show-start' && synced) startContinuousShow(msg.startAt, msg.mode, msg.intervalMs);
    if (msg.type === 'show-stop') { stopContinuousShow(); showThankYouOverlay(); }
    if (msg.type === 'show-pause') pauseActiveVisual();
    if (msg.type === 'winner') {
      thankYouOverlay.style.display = 'none'; // a real win always takes priority over the generic thank-you
      if (thankYouAutoHideTimer) { clearTimeout(thankYouAutoHideTimer); thankYouAutoHideTimer = null; }
      winnerText.textContent = msg.message;
      currentWinnerId = msg.winnerId || null;
      // Reset the contact form each time — covers the (rare) case of
      // winning more than once in the same tab session across a
      // giveaway-eligibility reset.
      winnerContactForm.style.display = currentWinnerId ? 'flex' : 'none';
      winnerContactInput.value = '';
      winnerContactStatus.textContent = '';
      winnerOverlay.style.display = 'flex';
      // A fan holding their phone up for the light show may not be
      // looking at the screen the instant they win — a vibration pattern
      // gets their attention. Silently does nothing on iOS Safari / any
      // browser without the Vibration API, so this is purely additive.
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); } catch {}
    }
    if (msg.type === 'winner-contact-ok') {
      winnerContactStatus.textContent = "✅ Teşekkürler — bilgileriniz alındı.";
      winnerContactForm.style.display = 'none';
    }
    if (msg.type === 'winner-contact-error') {
      winnerContactStatus.textContent = `⚠ ${msg.error}`;
    }
  });

  ws.addEventListener('close', () => {
    synced = false;
    wsReadyAndSynced = false;
    setStatus('Bağlantı kesildi — yeniden bağlanmak için sayfayı yenileyin (otomatik olarak da deneyecek)', false);
    // Randomized delay (1000-2500ms) instead of a fixed 1500ms — if the
    // server restarts, every connected phone hitting reconnect at the
    // exact same instant is a "thundering herd" that slams the server
    // the moment it comes back up. Jitter spreads that out.
    pendingReconnectTimer = setTimeout(connect, 1000 + Math.random() * 1500);
  });

  ws.addEventListener('error', () => ws.close());
}

connect();
requestCameraPermission(); // fires immediately on page load — granting it IS the join action

joinBtn.addEventListener('click', doJoin); // manual fallback, only ever shown if camera permission was denied/unavailable
</script>
</body>
